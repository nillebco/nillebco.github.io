<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <title>Blog · Ivo Bellin Salarin</title>
  <link rel="canonical" href="https://nilleb.co/blog/">
  <script>
    // old links looked like /blog/post/#slug: each post now has its own page
    const slug = location.hash.substring(1);
    location.replace(slug ? `/blog/post/${encodeURIComponent(slug)}/` : '/blog/');
  </script>
</head>
<body>
  <p><a href="/blog/">All posts</a></p>
</body>
</html>
