<script>
  // Old shared links looked like /blog/#slug: forward them to the post page.
  if (window.location.hash.length > 1) {
    window.location.replace(`post/${window.location.hash.substring(1)}/`);
  }

  document.addEventListener('htmx:afterSettle', async function(evt) {
    const blogList = document.getElementById('blog-list');
    if (blogList && !blogList.hasContent) {
      blogList.hasContent = true;

      const response = await fetch('posts.json', {
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache',
          'Expires': '0'
        }
      });
      const posts = await response.json();

      blogList.replaceChildren(...posts.map(post => {
        const li = document.createElement('li');
        li.className = 'blog-item';

        const emoji = document.createElement('span');
        emoji.className = 'emoji';
        emoji.textContent = post.emoji || '';

        const link = document.createElement('a');
        link.className = 'post-link';
        link.href = `post/${post.slug}/`;
        link.textContent = post.title;
        link.addEventListener('click', () => {
          window.nillebAnalytics?.trackEvent(`blog-post-${post.slug}`, { slug: post.slug });
        });

        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = post.date;

        const tags = document.createElement('div');
        tags.className = 'tags';
        (post.tags || []).forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = tag;
          tags.append(span);
        });

        li.append(emoji, link, date, tags);
        return li;
      }));
    }
  });
</script>
